<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" fill="none">
  <defs>
    <linearGradient id="wd-blue" x1="10" y1="6" x2="72" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wd-cyan" x1="72" y1="6" x2="134" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <clipPath id="wd-left">
      <rect x="0" y="0" width="72" height="144" />
    </clipPath>
    <clipPath id="wd-right">
      <rect x="72" y="0" width="72" height="144" />
    </clipPath>
    <clipPath id="wd-w-bounds">
      <rect x="0" y="70" width="144" height="74" />
    </clipPath>
    <mask id="wd-server-mask">
      <rect x="0" y="0" width="144" height="144" fill="#ffffff" />
      <circle cx="55.5" cy="52" r="2.7" fill="#000000" />
      <rect x="75.5" y="50.6" width="15" height="2.8" rx="1.4" fill="#000000" />
      <circle cx="55.5" cy="70" r="2.7" fill="#000000" />
      <rect x="75.5" y="68.6" width="15" height="2.8" rx="1.4" fill="#000000" />
    </mask>

    <g id="wd-mark-strokes">
      <!-- Roof Chevron -->
      <polygon points="72,4 13,60 25.5,60 72,16.5 118.5,60 131,60" fill="currentColor" />

      <!-- Dual Server Blades (transparent LED & drive slot cutouts) -->
      <g mask="url(#wd-server-mask)" fill="currentColor">
        <rect x="47" y="46" width="50" height="12" rx="3" />
        <rect x="47" y="64" width="50" height="12" rx="3" />
      </g>

      <!-- Geometric W Base (mitered uniform strokes clipped cleanly at y=70) -->
      <g clip-path="url(#wd-w-bounds)">
        <!-- Top horizontal chamfer bars -->
        <rect x="7" y="70" width="29" height="8.5" rx="0.5" fill="currentColor" />
        <rect x="108" y="70" width="29" height="8.5" rx="0.5" fill="currentColor" />

        <!-- Main continuous W sweep: left outer -> bottom-left -> center cross -> inner peak -> right trough -> right wing -->
        <polyline
          points="12,68 47,124 83,79 97,98 114,68"
          stroke="currentColor"
          stroke-width="10"
          stroke-linejoin="miter"
          stroke-miterlimit="6"
          stroke-linecap="butt"
          fill="none"
        />

        <!-- Left inner folded chevron -->
        <polyline
          points="31,68 47,94 60,79 65,86"
          stroke="currentColor"
          stroke-width="9"
          stroke-linejoin="miter"
          stroke-miterlimit="6"
          stroke-linecap="butt"
          fill="none"
        />

        <!-- Right outer leg wrapping to bottom-right point -->
        <polyline
          points="132,68 97,124 82,102"
          stroke="currentColor"
          stroke-width="10"
          stroke-linejoin="miter"
          stroke-miterlimit="6"
          stroke-linecap="butt"
          fill="none"
        />
      </g>
    </g>
  </defs>

  <use href="#wd-mark-strokes" clip-path="url(#wd-left)" style="color: #2f7df6;" fill="url(#wd-blue)" />
  <use href="#wd-mark-strokes" clip-path="url(#wd-right)" style="color: #29d0f6;" fill="url(#wd-cyan)" />

  <!-- Live Status Dot -->
  <circle cx="72" cy="131" r="6" fill="#10b981" />
</svg>
